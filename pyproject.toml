[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-ai"
version = "2.0.0"
description = "ASTRA AI - Camera-Based Road Safety and Emergency Visual Detection Platform"
authors = [{ name = "Google DeepMind Advanced Agentic Coding Pair" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "opencv-python>=4.10.0",
    "ultralytics>=8.2.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
